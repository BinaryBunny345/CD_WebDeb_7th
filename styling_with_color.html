<!DOCTYPE html>
<html lang="en">
    <head>
        <title>HTML colors</title>
        <meta charset="UTF-8">
        <style>
            body
            h1{
                text-align: center
            }
            .Complementary{
                color:aliceblue;
                width: 50%;
                height: 100%;
                background-color:blue;
                border-radius: 10px;
                font-size: 1rem;
                border: solid 5px orange;
            }
            body
            h1{
                text-align: center
            }
            .Analogous{
                color:aliceblue;
                width: 50%;
                height: 100%;
                background-color:green;
                border-radius: 10px;
                font-size: 1rem;
                border: solid 5px yellow;
            }
            body
            h1{
                text-align: center
            }
            .Triadic{
                color:aliceblue;
                width: 50%;
                height: 100%;
                background-color:red;
                border-radius: 10px;
                font-size: 1rem;
                border: solid 5px blue;
            }
        </style>
   </head>
    <body>
        <div class="Complementary">
        <h1>Complementary</h1></div>
        <div class="Analogous">
        <h1>Analogous</h1></div>
        <div class="Triadic">
        <h1>Triadic</h1></div>
        </div>
    </body>
</html>
